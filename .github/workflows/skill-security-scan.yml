name: Skill Security Scan

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skill_url:
        description: "GitHub repository URL of the Skill to scan"
        required: true
        type: string
      scan_name:
        description: "Human-readable scan name"
        required: false
        default: "manual-scan"
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set scan target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "skill_url=https://github.com/Leonxlnx/unlazy" >> "$GITHUB_OUTPUT"
            echo "scan_name=unlazy-first-test" >> "$GITHUB_OUTPUT"
          else
            echo "skill_url=${{ inputs.skill_url }}" >> "$GITHUB_OUTPUT"
            echo "scan_name=${{ inputs.scan_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install SkillSpector
        run: |
          uv tool install git+https://github.com/NVIDIA/skillspector.git

      - name: Scan Skill
        run: |
          mkdir -p reports
          skillspector scan "${{ steps.target.outputs.skill_url }}" --no-llm --format json --output reports/skillspector-report.json

      - name: Validate report
        run: |
          test -s reports/skillspector-report.json
          python -m json.tool reports/skillspector-report.json > /dev/null

      - name: Upload SkillSpector report
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-${{ steps.target.outputs.scan_name }}
          path: reports/skillspector-report.json
          if-no-files-found: error
